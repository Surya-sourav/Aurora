services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Set FRONTEND_ORIGIN to your frontend's public URL in prod.
      FRONTEND_ORIGIN: http://localhost:3000
      # Postgres — pick one:
      #   1. Neon: fill PGHOST/USER/PASSWORD/DATABASE from your Neon dashboard.
      #   2. Local: uncomment the `postgres` service below and point PGHOST=postgres.
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_NAME: ${ADMIN_NAME:-Anonymous}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked in at build time — used only for OG images / RSS metadata.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: aurora-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Read server-side by the /api/public and /api/img proxies.
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - backend

  # Uncomment to run a local Postgres instead of Neon. Then set
  # PGHOST=postgres in the backend service above.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: aurora-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${PGUSER}
  #     POSTGRES_PASSWORD: ${PGPASSWORD}
  #     POSTGRES_DB: ${PGDATABASE}
  #   volumes:
  #     - aurora-pg:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

