# Render blueprint — provisions the Aurora backend + frontend as two web
# services with a single "New Blueprint" action. Secrets are left blank and
# must be filled in via the Render dashboard on first deploy.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aurora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: 5432
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: aurora-frontend
          property: host

  - type: web
    name: aurora-frontend
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aurora-backend
          property: host
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
