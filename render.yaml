# Render blueprint — provisions the Aurora backend + frontend as two web
# services with a single "New Blueprint" action.
#
# NOTE: The two services need to know each other's PUBLIC URLs
# (NEXT_PUBLIC_API_URL, FRONTEND_ORIGIN). Render's blueprint spec doesn't
# expose public URLs via `fromService`, so those two vars are left blank
# here — set them in the dashboard after the first deploy and trigger a
# redeploy. See README.md → "Deploy to Render" for the exact steps.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aurora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: 5432
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: aurora-frontend
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
